# Ambiente local — paridade com OCI (sem publicar porta no host).
# Acesso via nginx-local na rede projetos-local:
#   http://192.168.15.119/barbear-ia/
#   http://localhost/barbear-ia/
#
# Subir:
#   docker compose -f docker-compose.local.yml up -d --build
#
# Pré-requisito: rede projetos-local + container nginx-local
#   (ver /home/guelfi/Projetos/docker-compose.nginx.local.yml)

services:
  barbear-ia-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbear-ia-frontend
    expose:
      - "80"
    networks:
      - barbear-ia-net
      - projetos-local
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  barbear-ia-net:
    driver: bridge
  projetos-local:
    external: true
