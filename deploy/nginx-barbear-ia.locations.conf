# Fragmento inserido pelo CD no nginx-proxy (OCI).
# Paths públicos: /barbear-ia/api/ · /barbear-ia/swagger/ · /barbear-ia/

    # ---- Barbear.IA API / Swagger (antes do front — prefixo mais específico) --
    location = /barbear-ia/swagger {
      return 301 /barbear-ia/swagger/index.html;
    }

    location = /barbear-ia/swagger/ {
      return 301 /barbear-ia/swagger/index.html;
    }

    location ^~ /barbear-ia/swagger/ {
      set $upstream_barbearia_api http://barbear-ia-api:8080;
      rewrite ^/barbear-ia/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_barbearia_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /barbear-ia/api/ {
      set $upstream_barbearia_api http://barbear-ia-api:8080;
      rewrite ^/barbear-ia/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_barbearia_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Barbear.IA Frontend -----------------------------------------------
    location ^~ /barbear-ia/ {
      set $upstream_barbearia http://barbear-ia-frontend:80;
      rewrite ^/barbear-ia/(.*)$ /$1 break;
      proxy_pass $upstream_barbearia;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
