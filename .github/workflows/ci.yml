name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-audit:
    name: Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barbear_ia
          POSTGRES_USER: barbear
          POSTGRES_PASSWORD: barbear_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbear -d barbear_ia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=barbear_ia;Username=barbear;Password=barbear_dev
      ConnectionStrings__Redis: localhost:6379
      Jwt__SigningKey: CI_ONLY_CHANGE_ME_BarbearIA_Jwt_Signing_Key_32+
      Seed__Enabled: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Barbear.IA.slnx
        working-directory: backend

      - name: Build
        run: dotnet build Barbear.IA.slnx -c Release --no-restore
        working-directory: backend

      - name: Test
        run: dotnet test Barbear.IA.slnx -c Release --no-build --verbosity normal
        working-directory: backend

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE "Critical|High" vuln.txt; then
            echo "Pacotes vulneráveis High/Critical encontrados"
            exit 1
          fi
        working-directory: backend
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-and-audit, secret-scanning, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t barbear-ia:test .

      - name: Build API Docker image
        run: docker build -t barbear-ia-api:test -f backend/Dockerfile backend
