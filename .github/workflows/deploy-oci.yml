name: CD - Deploy to OCI

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Digite YES para confirmar o deploy na OCI'
        required: true
        default: ''
  workflow_run:
    workflows: ["CI - Build & Validate"]
    types:
      - completed

concurrency:
  group: deploy-oci-barbearia
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deploy inputs
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch and confirmation
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Deploy permitido apenas a partir do branch 'main'. Branch atual: ${GITHUB_REF}"
              exit 1
            fi

            CONFIRM_RAW="${{ github.event.inputs.confirm_deploy }}"
            CONFIRM_CLEAN="$(echo "$CONFIRM_RAW" | tr -d '\r\n\t ' | tr '[:lower:]' '[:upper:]')"
            if [ "$CONFIRM_CLEAN" != "YES" ]; then
              echo "::error::Para executar o deploy, preencha confirm_deploy exatamente com YES."
              exit 1
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::Deploy automático bloqueado: CI não está verde (conclusion=${{ github.event.workflow_run.conclusion }})."
              exit 1
            fi

            if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "::error::Deploy automático bloqueado: apenas push em 'main' dispara deploy (branch=${{ github.event.workflow_run.head_branch }})."
              exit 1
            fi
          fi

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate immutable deployment revision
        run: |
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Invalid deployment revision'; exit 1; }

      - name: Checkout validated deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add OCI host to known_hosts
        run: ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to OCI server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "bash -s -- '$DEPLOY_SHA'" << 'EOF'
            set -euo pipefail
            DEPLOY_SHA=$1
            cd /var/www/Barbear.IA
            git fetch origin main
            git cat-file -e "$DEPLOY_SHA^{commit}"
            if [[ $(git rev-parse origin/main) != "$DEPLOY_SHA" ]]; then
              echo 'Deploy skipped: a newer main revision exists; wait for its approved CI.'
              exit 1
            fi
            git reset --hard "$DEPLOY_SHA"

            # Garante .env de produção (não sobrescreve se já existir)
            if [ ! -f .env ]; then
              printf '%s\n' \
                'VITE_BASE_PATH=/' \
                'VITE_API_URL=https://barbear.me/api/v1' \
                'POSTGRES_DB=barbear_ia' \
                'POSTGRES_USER=barbear' \
                'POSTGRES_PASSWORD=barbear_oci_change_me' \
                'Jwt__SigningKey=CHANGE_ME_OCI_BarbearIA_Jwt_Signing_Key_32chars+' \
                'Seed__Enabled=false' \
                'Seed__SuperAdmin__Email=admin@barbear.ia' \
                'Seed__SuperAdmin__Password=Admin123#' \
                'Swagger__Enabled=true' \
                'Evolution__Enabled=false' \
                > .env
              echo "Created default .env — altere Jwt/Postgres em produção."
            fi

            # Preserve o projeto Compose/volume PostgreSQL já existente na OCI.
            # Seeds de desenvolvimento redefinem senhas; deploys preservam usuários.
            sudo env Seed__Enabled=false docker compose -p barbearia --env-file .env up -d --build --remove-orphans

            # O proxy compartilhado é administrado pela infraestrutura central.
            # O deploy deste app nunca reescreve rotas dos demais projetos.
            sudo docker exec nginx-proxy nginx -t
          EOF

      - name: Verify deployment
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
          BARBEAR_PUBLIC_URL: ${{ vars.BARBEAR_PUBLIC_URL || 'https://barbear.me/' }}
          BARBEAR_API_HEALTH_URL: ${{ vars.BARBEAR_API_HEALTH_URL || 'https://barbear.me/api/health' }}
        run: |
          echo "Waiting for stack to stabilize..."
          sleep 30
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker ps --filter name=barbear-ia --format 'table {{.Names}}\t{{.Status}}'"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker exec barbear-ia-frontend wget -q -O /dev/null http://127.0.0.1/health && echo 'frontend health OK'"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker exec barbear-ia-api curl -fsS http://127.0.0.1:8080/health && echo && echo 'api health OK'"
          # Frontend e API públicos devem responder com HTTPS válido.
          # Falhas interrompem o deploy; rollback pode usar variáveis de URL.
          curl --fail --silent --show-error --location --max-time 30 \
            --output /dev/null "$BARBEAR_PUBLIC_URL"
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null "$BARBEAR_API_HEALTH_URL"
          echo "=== Deployed commit (server) ==="
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "cd /var/www/Barbear.IA && git log -1 --oneline"
