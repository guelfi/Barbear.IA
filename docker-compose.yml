version: '3.3'

services:
  barbear-ia-frontend:
    build: .
    container_name: barbear-ia-frontend
    expose:
      - "80"
    networks:
      - barbear-ia-net
      - www_projetos-net
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  barbear-ia-net:
    driver: bridge
  www_projetos-net:
    external: true